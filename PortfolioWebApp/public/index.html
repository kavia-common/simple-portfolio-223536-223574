<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Mobile viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Primary Meta Tags -->
    <title>Alex Doe • Portfolio</title>
    <meta name="title" content="Alex Doe • Portfolio" />
    <meta
      name="description"
      content="Personal portfolio of Alex Doe: projects, skills, and contact."
    />
    <meta name="author" content="Alex Doe" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />

    <!-- Canonical: will be set/updated at runtime by src/utils/seo.js if REACT_APP_FRONTEND_URL is provided -->
    <link rel="canonical" href="/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alex Doe • Portfolio" />
    <meta
      property="og:description"
      content="Personal portfolio of Alex Doe: projects, skills, and contact."
    />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="Alex Doe Portfolio" />
    <!-- Optional placeholder image; replace with your hosted image when available -->
    <meta property="og:image" content="" />
    <meta property="og:image:alt" content="Preview image for Alex Doe Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alex Doe • Portfolio" />
    <meta
      name="twitter:description"
      content="Personal portfolio of Alex Doe: projects, skills, and contact."
    />
    <meta name="twitter:image" content="" />

    <!-- Favicon (optional placeholder paths, replace with your own assets if present) -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Manifest (CRA default, optional) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Performance: Preconnect to common external hosts used by images and fonts -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
